[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tunefinder"
version = "0.1.0"
description = "Universal music recognition tool (Shazamio backend) with CLI and Web UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tunefinder" }]
dependencies = [
    "shazamio>=0.8.1",
    "pydub>=0.25.1",
    "yt-dlp>=2024.1.0",
    "click>=8.1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
acoustid = ["pyacoustid>=1.3.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5.0",
]

[project.scripts]
tunefinder = "tunefinder.cli:main"

[project.urls]
Homepage = "https://github.com/Miss-you/tunefinder"
Repository = "https://github.com/Miss-you/tunefinder"
Issues = "https://github.com/Miss-you/tunefinder/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tunefinder.web" = ["static/*"]

# ---------------- Tooling ----------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["downloads", "samples", ".venv"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, B = bugbear, UP = pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line-too-long handled by formatter
    "B008",  # FastAPI depends() pattern
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
